---
services:
  git:
    image: "gitea/gitea:28.1.0"
    init: true
    hostname: git
    environment:
      APP_NAME: ${GIT_APP_NAME:-gitea}
      USER_UID: ${UID:-1000}
      USER_GID: ${GID:-1000}
      RUN_MODE: ${GIT_RUN_MODE:-prod}
      DOMAIN: ${GIT_DOMAIN:-gitea.internal}
      SSH_DOMAIN: ${GIT_SSH_DOMAIN:-gitea.internal}
      HTTP_PORT: ${GIT_HTTP_PORT:-3000}
      ROOT_URL: ${GIT_ROOT_URL:-https://${GIT_DOMAIN:-gitea.internal}/}
      SSH_PORT: ${GIT_SSH_PORT:-222}
      SSH_LISTEN_PORT: ${GIT_SSH_LISTEN_PORT:-22}
      DB_TYPE: ${GIT_DB_TYPE:-sqlite3}
      DISABLE_REGISTRATION: ${GIT_DISABLE_REGISTRATION:-true}
    restart: unless-stopped
    volumes:
      - "git_data:/data"
    networks:
      - git_cicd_net
    ports:
      - "${GIT_HTTP_PORT:-3000}:3000"
      - "222:22"

  cron:
    image: "premoweb/chadburn:1.0.7"
    init: true
    hostname: cron
    configs:
      - source: chadburn_config
        target: /opt/chadburn/config.ini
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    restart: unless-stopped
    networks:
      - git_cicd_net
    command: daemon --config=/opt/chadburn/config.ini

  # TODO (jpd): to start renovate we must change ownership of renovate_data to
  # ubuntu user
  renovate:
    image: "renovate/renovate:44.151.5-full"
    init: true
    hostname: renovate
    environment:
      GITHUB_COM_TOKEN: ${GITHUB_COM_TOKEN:-token}
      RENOVATE_TOKEN: ${RENOVATE_TOKEN:-token}
      RENOVATE_ENDPOINT: ${RENOVATE_ENDPOINT:-http://git:3000/api/v1}
      RENOVATE_GIT_AUTHOR: ${RENOVATE_GIT_AUTHOR:-'renovate <renovate@example.com>'}
      RENOVATE_CONFIG_FILE: "/opt/renovate/config.js"
      RENOVATE_BASE_DIR: "/opt/renovate_data"
    labels:
      chadburn.enabled: "true"
      chadburn.job-exec.renovate.schedule: "@every 30m"
      chadburn.job-exec.renovate.command: "/usr/local/sbin/renovate"
    configs:
      - source: renovate_config
        target: /opt/renovate/config.js
    volumes:
      - "renovate_data:/opt/renovate_data"
    restart: unless-stopped
    networks:
      - git_cicd_net
    entrypoint: sleep
    command: infinity

configs:
  chadburn_config:
    file: ./config/cron/config.ini
  renovate_config:
    file: ./config/renovate/config.js

volumes:
  git_data: {}
  renovate_data: {}

networks:
  git_cicd_net:
    name: git_cicd_net
