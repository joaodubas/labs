---
labels:
  - user
  - neovim
depends:
  - user.fish
actions:
  # Clone kickstart.nvim and reset to proper commit
  - action: git.clone
    repo_url: https://github.com/nvim-lua/kickstart.nvim.git
    directory: "{{ env.XDG_CONFIG_HOME }}/nvim"
  - action: command.run
    dir: "{{ env.XDG_CONFIG_HOME }}/nvim"
    command: git
    args:
      - fetch
      - --prune
      - origin
  - action: command.run
    dir: "{{ env.XDG_CONFIG_HOME }}/nvim"
    command: git
    args:
      - restore
      - "*"
  - action: command.run
    dir: "{{ env.XDG_CONFIG_HOME }}/nvim"
    command: git
    args:
      - reset
      - --hard
      - 626c660f54054953e630bef85fdf65e159c7516a
  # Download init.lua patch, apply it, and remove it
  - action: file.download
    from: "{{ variables.neovim_init_patch_path }}"
    to: /tmp/nvim.patch
  - action: command.run
    dir: "{{ env.XDG_CONFIG_HOME }}/nvim"
    command: git
    args:
      - apply
      - /tmp/nvim.patch
  - action: file.remove
    target: /tmp/nvim.patch
