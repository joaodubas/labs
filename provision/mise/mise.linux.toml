# Linux layer for the mise bootstrap. Loaded via `mise -E linux ...`
# (bootstrap.sh picks the variant based on `uname -s`).
#
# Privileged operations use `sudo` inside the task commands: mise 2026.9.3
# has no task-level `sudo` field (verified against `mise tasks validate`).

# ---------------------------------------------------------------------------
# system packages — task bodies live in tasks/linux/* (file tasks);
# this file keeps only depends stubs and the bootstrap override
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# desktop apps (not in the mise registry: vendor scripts / flatpak / snap)
# — task bodies live in tasks/apps/*
# ---------------------------------------------------------------------------

[tasks."apps:wezterm"]
description = "wezterm via flatpak (needs system bus — skipped headless)"
depends = ["linux:flatpak"]
run = '''
if [ ! -S /run/dbus/system_bus_socket ]; then
  echo "no system bus (systemd), skipping flatpak install"
  exit 0
fi
sudo flatpak install -y --or-update flathub org.wezfurlong.wezterm
'''

[tasks."apps:zenbrowser"]
description = "zen browser via flatpak (needs system bus — skipped headless)"
depends = ["linux:flatpak"]
run = '''
if [ ! -S /run/dbus/system_bus_socket ]; then
  echo "no system bus (systemd), skipping flatpak install"
  exit 0
fi
sudo flatpak install -y --or-update flathub app.zen_browser.zen
'''

[tasks."apps:ghostty"]
description = "ghostty via snap (classic); skipped where snapd can't run (no systemd)"
depends = ["linux:apt-base"]
run = '''
if [ ! -d /run/systemd/system ]; then
  echo "systemd not available, skipping ghostty (snap requires it)"
  exit 0
fi
sudo snap install ghostty --classic
'''

[tasks."apps:cursor"]
description = "cursor editor via vendor install script"
depends = ["linux:apt-base"]
run = '''
curl -fsSL https://cursor.com/install -o /tmp/cursor.sh
chmod 0750 /tmp/cursor.sh
(cd /tmp && ./cursor.sh)
rm -f /tmp/cursor.sh
'''

[tasks."apps:zed"]
description = "zed editor via vendor install script"
depends = ["linux:apt-base"]
run = '''
curl -fsSL https://zed.dev/install.sh -o /tmp/zed.sh
chmod 0750 /tmp/zed.sh
# zed.sh dereferences $SHELL unguarded (set -u); docker exec sessions have none
(cd /tmp && SHELL="${SHELL:-/bin/bash}" ./zed.sh)
rm -f /tmp/zed.sh
'''

# ---------------------------------------------------------------------------
# fonts / shell / desktop input
# ---------------------------------------------------------------------------

[tasks."fonts:nerd"]
description = "JetBrainsMono + Go-Mono nerd fonts"
depends = ["linux:apt-base"]
run = '{{ config_root }}/scripts/nerd-fonts.sh'

[tasks."shell:fish"]
description = "Set fish as the login shell (usermod)"
depends = ["linux:apt-base"]
run = 'sudo usermod --shell /usr/bin/fish "$(id -un)"'

[tasks."linux:cedilla"]
description = "cedilla input: .xsessionrc appends (once), XCompose, gsettings ibus override"
depends = ["linux:apt-base"]
run = '''
if ! grep -qF "GTK_IM_MODULE=cedilla" "$HOME/.xsessionrc" 2>/dev/null; then
  echo "export GTK_IM_MODULE=cedilla" >> "$HOME/.xsessionrc"
fi
if ! grep -qF "QT_IM_MODULE=cedilla" "$HOME/.xsessionrc" 2>/dev/null; then
  echo "export QT_IM_MODULE=cedilla" >> "$HOME/.xsessionrc"
fi
cp "{{ config_root }}/files/cedilla/XCompose" "$HOME/.XCompose"
if command -v gsettings >/dev/null 2>&1 && \
   gsettings list-schemas 2>/dev/null | grep -q '^org\.gnome\.settings-daemon\.plugins\.xsettings$'; then
  gsettings set org.gnome.settings-daemon.plugins.xsettings overrides "{'Gtk/IMModule':<'ibus'>}"
else
  echo "gsettings/GNOME schemas not available, skipping ibus override"
fi
'''

# ---------------------------------------------------------------------------
# ordering of shared tasks relative to the apt base (fields merge with
# mise.toml definitions; only `depends` is added here)
# ---------------------------------------------------------------------------

[tasks."config:mise"]
depends = ["linux:apt-base"]

[tasks."ide:clone"]
depends = ["linux:apt-base"]

[tasks."git:config"]
depends = ["linux:apt-base"]

[tasks."fish:config"]
depends = ["shell:fish"]

[tasks."neovim:kickstart"]
depends = ["linux:apt-base"]

[tasks."tmux:config"]
depends = ["linux:apt-base"]

# ---------------------------------------------------------------------------
# full bootstrap (overrides the shared bootstrap task)
# ---------------------------------------------------------------------------

[tasks.bootstrap]
description = "Full Linux bootstrap: system packages, apps, fonts, shell, user config"
depends = [
  "linux:apt-base",
  "linux:docker",
  "linux:flatpak",
  "linux:cuda-wsl",
  "linux:qemu",
  "linux:cedilla",
  "apps:wezterm",
  "apps:zenbrowser",
  "apps:ghostty",
  "apps:cursor",
  "apps:zed",
  "fonts:nerd",
  "shell:fish",
  "fish:config",
  "fish:env",
  "git:config",
  "git:includes",
  "git:allowed-signers",
  "neovim:kickstart",
  "tmux:config",
  "tmux:tpm",
  "tmuxp:sessions",
  "config:mise",
  "config:atuin",
  "config:starship",
  "tools:cli",
]
