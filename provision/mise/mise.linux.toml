# Linux layer for the mise bootstrap. Loaded via `mise -E linux ...`
# (bootstrap.sh picks the variant based on `uname -s`).
#
# Privileged operations use `sudo` inside the task commands: mise 2026.9.3
# has no task-level `sudo` field (verified against `mise tasks validate`).

# ---------------------------------------------------------------------------
# system packages — task bodies live in mise/tasks/linux/* (file tasks);
# this file keeps only depends stubs and the bootstrap override
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# desktop apps (not in the mise registry: vendor scripts / flatpak / snap)
# — task bodies live in mise/tasks/apps/*
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# fonts / shell / desktop input — bodies live in mise/tasks/{fonts,shell,linux}
# ---------------------------------------------------------------------------

# shell:fish body lives in mise/tasks/shell/fish (uname-branched); the stub
# below pins its position in the apt chain
[tasks."shell:fish"]
depends = ["linux:apt-base"]

# ---------------------------------------------------------------------------
# ordering of shared tasks relative to the apt base (fields merge with
# the file-task definitions under mise/tasks/; only `depends` is added here)
# ---------------------------------------------------------------------------

[tasks."config:mise"]
depends = ["linux:apt-base"]

[tasks."ide:clone"]
depends = ["linux:apt-base"]

[tasks."git:config"]
depends = ["linux:apt-base"]

[tasks."fish:config"]
depends = ["shell:fish"]

[tasks."neovim:kickstart"]
depends = ["linux:apt-base"]

[tasks."tmux:config"]
depends = ["linux:apt-base"]

# ---------------------------------------------------------------------------
# full bootstrap (overrides the shared bootstrap task)
# ---------------------------------------------------------------------------

[tasks.bootstrap]
description = "Full Linux bootstrap: system packages, apps, fonts, shell, user config"
depends = [
  "linux:apt-base",
  "linux:docker",
  "linux:flatpak",
  "linux:cuda-wsl",
  "linux:qemu",
  "linux:cedilla",
  "apps:wezterm",
  "apps:zenbrowser",
  "apps:ghostty",
  "apps:cursor",
  "apps:zed",
  "fonts:nerd",
  "shell:fish",
  "fish:config",
  "fish:env",
  "git:config",
  "git:includes",
  "git:allowed-signers",
  "neovim:kickstart",
  "tmux:config",
  "tmux:tpm",
  "tmuxp:sessions",
  "config:mise",
  "config:atuin",
  "config:starship",
  "tools:cli",
]
