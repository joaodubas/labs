# mise bootstrap configuration — machine provisioning.
#
# Run via ./bootstrap.sh, which installs mise if missing and invokes
# `mise -E linux|macos bootstrap`, layering mise.linux.toml or mise.macos.toml
# over this file (mise 2026.9.3 has no automatic OS-variant config loading;
# the -E/--env mechanism is used instead).
#
# This file holds the OS-independent surface: [vars] and the shared tasks.
# OS-specific tasks and `depends` wiring live in the variant files.

min_version = "2026.9.3"

[vars]
# Single source of truth for runtime configs: the ide repo, cloned once by
# the ide:clone task; every config task copies from the local clone.
ide_repo_url = "https://gitea.dubas.dev/joao.dubas/ide.git"
ide_dir = "$HOME/.local/share/ide"

# CLI tools previously installed via vendor install.sh scripts; now pinned,
# *global* mise tools — body lives in mise/tasks/tools/cli (file task).

# ---------------------------------------------------------------------------
# ide repo clone + config files copied from it (single source of truth, §10.2)
# — task bodies live in mise/tasks/ide/clone and mise/tasks/config/*
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# git
# ---------------------------------------------------------------------------

[tasks."git:config"]
description = "Set global git configuration (identity, nvim difftool/mergetool, includeIf rules)"
run = [
  'git config --global user.email joao.dubas@gmail.com',
  'git config --global user.name "Joao P Dubas"',
  'git config --global gpg.ssh.allowedSignersFile "{{ xdg_config_home }}/git/allowed_signers"',
  'git config --global core.editor nvim',
  'git config --global diff.tool nvimdiff',
  'git config --global difftool.nvimdiff.layout "LOCAL,REMOTE"',
  'git config --global merge.tool nvimdiff',
  'git config --global mergetool.nvimdiff.layout "LOCAL,BASE,REMOTE / MERGED"',
  'git config --global "includeIf.hasconfig:remote.*.url:gitea:*/**.path" "{{ xdg_config_home }}/git/personal_gitea"',
  'git config --global "includeIf.hasconfig:remote.*.url:github:joaodubas/**.path" "{{ xdg_config_home }}/git/personal_github"',
  'git config --global "includeIf.gitdir:/opt/work/.path" "{{ xdg_config_home }}/git/work"',
]

[tasks."git:includes"]
description = "Install git includeIf fragments from the local files/ tree (both OSes)"
depends = ["git:config"]
run = '''
mkdir -p "{{ xdg_config_home }}/git"
cp "{{ config_root }}/files/git/personal_gitea" "{{ xdg_config_home }}/git/personal_gitea"
cp "{{ config_root }}/files/git/personal_github" "{{ xdg_config_home }}/git/personal_github"
cp "{{ config_root }}/files/git/work" "{{ xdg_config_home }}/git/work"
'''

[tasks."git:allowed-signers"]
description = "Build git allowed_signers from ~/.ssh/*.pub keys"
depends = ["git:includes"]
run = '{{ config_root }}/scripts/git-allowed-signers.sh'

# ---------------------------------------------------------------------------
# fish (login shell setup itself is OS-specific: shell:fish in the variants)
# ---------------------------------------------------------------------------

[tasks."fish:config"]
description = "Install fish config.fish from the local files/ tree"
run = '''
mkdir -p "{{ xdg_config_home }}/fish"
cp "{{ config_root }}/files/fish/config.fish" "{{ xdg_config_home }}/fish/config.fish"
'''

[tasks."fish:env"]
description = "Set fish universal variables, PATH entries and abbreviations"
depends = ["fish:config", "tools:cli"]
run = '{{ config_root }}/scripts/fish-env.sh'

# ---------------------------------------------------------------------------
# neovim / tmux / tmuxp
# ---------------------------------------------------------------------------

[tasks."neovim:kickstart"]
description = "Clone kickstart.nvim @ 626c660, apply ide patch, install custom plugins"
depends = ["ide:clone"]
run = '{{ config_root }}/scripts/neovim-kickstart.sh "{{ vars.ide_dir }}"'

[tasks."tmux:config"]
description = "Install tmux.conf from the local ide clone"
depends = ["ide:clone"]
run = '''
mkdir -p "{{ xdg_config_home }}/tmux"
cp "{{ vars.ide_dir }}/config/tmux/tmux.conf" "{{ xdg_config_home }}/tmux/tmux.conf"
'''

[tasks."tmux:tpm"]
description = "Clone tmux plugin manager (tpm)"
depends = ["tmux:config"]
run = '''
if [ ! -d "{{ xdg_config_home }}/tmux/plugins/tpm/.git" ]; then
  mkdir -p "{{ xdg_config_home }}/tmux/plugins"
  git clone https://github.com/tmux-plugins/tpm.git "{{ xdg_config_home }}/tmux/plugins/tpm"
fi
'''

[tasks."tmuxp:sessions"]
description = "Install tmuxp session files from the local ide clone"
depends = ["ide:clone"]
run = '''
mkdir -p "{{ xdg_config_home }}/tmuxp"
cp "{{ vars.ide_dir }}/config/tmuxp/personal.yml" "{{ xdg_config_home }}/tmuxp/personal.yml"
cp "{{ vars.ide_dir }}/config/tmuxp/work.yml" "{{ xdg_config_home }}/tmuxp/work.yml"
'''

# ---------------------------------------------------------------------------
# bootstrap entry task (runs after the tools phase). The OS variant files
# override this with their full depends list; this base covers shared tasks.
# ---------------------------------------------------------------------------

[tasks.bootstrap]
description = "Shared bootstrap: ide clone, configs, git, fish, neovim, tmux/tmuxp"
depends = [
  "ide:clone",
  "config:mise",
  "config:atuin",
  "config:starship",
  "tools:cli",
  "git:config",
  "git:includes",
  "git:allowed-signers",
  "fish:config",
  "fish:env",
  "neovim:kickstart",
  "tmux:config",
  "tmux:tpm",
  "tmuxp:sessions",
]
